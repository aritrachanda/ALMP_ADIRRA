# Alembic configuration for the ADIRRA governance database (Business Glossary v2).
# The DSN is NOT stored here — env.py builds it from project.yaml (database:) +
# the ADM_DB_PASSWORD env var, per the repo config convention.
[alembic]
script_location = db/migrations
prepend_sys_path = .
path_separator = os
# Timezone for migration file timestamps.
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
