    \ THEN 0 ELSE 1 END ELSE NULL END AS general_guarantee,\n  g.amount AS guarantee_percent,\n\
    \  ROW_NUMBER() OVER (ORDER BY g.guarantee_id) AS id,\n  g.start_date AS inception_date,\n\
