- id: net_charge_off_ratio
  domain: Financial
  category: Banking
  title: Net Charge-off Ratio
  business_description: 'The percentage of loan balances that a bank has written off
    as uncollectible (net of any recoveries) in a given period, relative to average
    total loans outstanding. A key indicator of credit portfolio quality.

    '
  detailed_description: 'Net Charge-off Ratio = (Gross Charge-offs − Recoveries) /
    Average Loans Outstanding. Charge-offs occur when a lender determines that a debt
    is unlikely to be collected and removes it from its balance sheet as a loss. The
    metric is reported quarterly by regulated institutions and is monitored by supervisors
    as a lagging indicator of credit deterioration. Elevated ratios may trigger additional
    provisioning requirements under IFRS 9 / ECL models.

    '
  synonyms:
  - NCO Rate
  - Charge-off Rate
  related_objects:
