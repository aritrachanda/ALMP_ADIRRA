- id: maturity_date
  domain: Financial
  category: Lending
  title: Maturity Date
  business_description: The contractual date on which a loan or credit facility reaches
    its scheduled end and the outstanding balance is due for full repayment.
  detailed_description: Legally agreed final repayment date. Determines remaining
    tenor, LCR/NSFR bucket assignments, and IFRS 9 ECL loan lifetime.
  synonyms:
  - Final Maturity
  - Expiry Date
  - End Date
  - Legal Final Maturity
  related_objects:
  - source|banking|src.loans.maturity_date
  - source|banking|src.collateral.maturity_date
  - commitment
  - unconditionally cancellable commitment
  - credit conversion factor (CCF)
  - effective maturity
  - netting set
  steward: ''
  tags:
  - lending
  - maturity
  - liquidity
  - ifrs9
  status: approved
  CRR_context: Per CRR3 Art. 4(1)(56) and Art. 4(1)(10)-(11), the relevant contractual
    end point is the date by which a commitment or credit facility reaches its scheduled
    end and any outstanding amount is due, with the institution’s ability to cancel
    or the facility’s unconditionally cancellable nature affecting whether and how
    the exposure can continue. CRR3 also refers to the "longest contractual remaining
    maturity" in netting set calculations under counterparty credit risk, indicating
    that contractual maturity is a key regulatory parameter.
  DPM_context: This concept is reported in Additional Liquidity Monitoring template
    C_66.01.a (Maturity ladder. Total. Overnight and higher maturity), where contractual
    maturity buckets are populated for outflows from loan commitments given and credit
    facilities. Relevant cells include {C_48.02, r*, c0030} across the maturity intervals
    shown in the datapoints (e.g. <= 1 day, > 2 days <= 3 days, > 3 months <= 4 months).
