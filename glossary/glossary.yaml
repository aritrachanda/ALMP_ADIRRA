- id: legal_entity_identifier
  domain: Financial
  category: Banking
  title: Legal Entity Identifier
  business_description: 'A 20-character alphanumeric ISO 17442 code uniquely identifying
    a legal entity participating in financial transactions globally. Mandated by regulators
    for reporting under EMIR, MiFID II, and BCBS 239.

    '
  detailed_description: 'The LEI system is administered by the Global Legal Entity
    Identifier Foundation (GLEIF). Each LEI maps to a reference data record containing
    the entity''s legal name, registered address, and ownership structure. In this
    dataset approximately 13% of counterparties do not have an LEI (null), which may
    indicate private entities not required to register or data gaps that need remediation
    before regulatory submission.

    '
