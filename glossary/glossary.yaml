- id: credit_quality_step
  domain: Financial
  category: Banking
  title: Credit Quality Step
  business_description: 'A standardised 6-point scale (1 = best, 6 = worst) that maps
    external credit ratings to a common risk ladder used for regulatory capital calculations.
    Step 1 represents the highest creditworthiness; Step 6 represents the highest
    risk or default.

    '
  detailed_description: 'The Credit Quality Step (CQS) is defined in the CRR (Capital
    Requirements Regulation) and maps credit assessments from external credit assessment
    institutions (ECAIs) to a uniform scale. It determines the risk weight applied
    to an exposure under the Standardised Approach. A counterparty without an external
    rating is typically assigned CQS 3 or treated as unrated depending on the asset
    class.

    '
  synonyms:
  - CQS
  - Credit Rating Step
  related_objects:
  - source|banking|src.counterparties.credit_quality
  steward: ''
