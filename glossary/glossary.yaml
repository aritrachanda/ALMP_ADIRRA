- id: loan_collateral
  domain: Financial
  category: Banking
  title: Loan Collateral
  business_description: 'An asset pledged by a borrower to a lender as security for
    a loan. In the event of borrower default, the lender may seize and liquidate the
    collateral to recover the outstanding loan balance.

    '
  detailed_description: 'Collateral is tracked at the loan level in the loan_collateral
    table, linked to the loans table. Types of collateral include real estate, financial
    instruments, guarantees, and physical assets. The collateral value is compared
    to the exposure at default (EAD) to determine the secured portion and applicable
    LGD haircuts under the Foundation or Advanced IRB approach.

    '
  synonyms:
