- id: accounts_payable_turnover
  domain: Financial
  category: Banking
  title: Accounts Payable Turnover
  business_description: 'Measures how quickly a company pays off its suppliers. A
    higher ratio indicates faster payments to vendors and stronger short-term liquidity
    management.

    '
  detailed_description: 'Calculated as total supplier purchases divided by average
    accounts payable over a period. Used by treasury and procurement to monitor liquidity
    and supplier relationships. In credit analysis, a declining trend may indicate
    cash-flow pressure or deliberate extension of payment terms.

    '
  synonyms:
  - AP Turnover
  - Creditor Turnover Ratio
  related_objects:
  - source|banking|src.counterparties.annual_turnover
  steward: ''
  tags:
