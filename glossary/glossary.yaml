- id: balance_sheet_total
  domain: Financial
  category: Banking
  title: Balance Sheet Total
  business_description: 'The total value of all assets held by a counterparty as reported
    on its most recent audited balance sheet. A key metric for determining whether
    an entity qualifies as a Large, Medium, Small or Micro enterprise under regulatory
    definitions.

    '
  detailed_description: 'Balance Sheet Total (BST) represents the sum of all assets
    — both current and non-current — on an entity''s balance sheet at the reference
    date. Together with Annual Turnover and Number of Employees, it determines SME
    status under the EU Commission Recommendation 2003/361/EC. The BST is used in
    FINREP/COREP reporting as a counterparty size indicator.

    '
  synonyms:
  - Total Assets
  - BST
