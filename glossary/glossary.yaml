- id: default_event
  domain: Financial
  category: Banking
  title: Default Event
  business_description: 'An event in which a counterparty fails to meet its contractual
    debt obligations. In regulatory terms, default is triggered when a payment is
    more than 90 days past due or when it is unlikely that the obligor will repay
    in full without collateral realisation.

    '
  detailed_description: 'Default is defined under CRR Article 178. A counterparty
    in this dataset with a non-null default_date and entity_status of ''Defaulted''
    is considered in default at the reference date. The default_date records when
    the default event was first observed. Approximately 17% of counterparties have
    experienced a default event historically. Default status directly determines the
    loss given default (LGD) and expected credit loss (ECL) computations under IFRS
    9.

    '
  synonyms:
  - Credit Default
  - Obligor Default
  - PD Event
  related_objects:
