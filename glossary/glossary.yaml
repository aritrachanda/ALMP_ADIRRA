- id: counterparty
  domain: Financial
  category: Banking
  title: Counterparty
  business_description: 'Any legal entity or individual that is party to a financial
    contract or transaction with the reporting institution. Includes corporate borrowers,
    retail clients, financial institutions, sovereign entities, and public sector
    bodies.

    '
  detailed_description: 'A Counterparty is identified by a unique internal counterparty_id
    and may optionally carry an LEI (Legal Entity Identifier) for public entities.
    Counterparties are classified by entity_type (Corporate, SME, Retail, Financial,
    PublicSector), institutional_sector (ESA 2010 codes S11–S14), and legal_form.
    The counterparty record is the anchor for credit risk, exposure, and collateral
    data throughout the system.

    '
  synonyms:
  - Client
  - Obligor
  - Borrower
  - Entity
  related_objects:
  - source|banking|src.counterparties
  - source|banking|src.counterparties.counterparty_id
  - source|banking|src.counterparties.lei
  - source|banking|src.counterparties.entity_type
  - source|Faker|raw_faker.bank_accounts.customer_id
  steward: ''
  tags:
  - core
  - counterparty
  status: approved
  CRR_context: Per CRR3 Art. 383p and Art. 4(9)–(11), a counterparty is the entity
    to which an exposure is mapped for risk-weighting purposes, with the applicable
    risk weight determined by sector and credit quality; where no external rating
    exists, institutions may map an internal rating to an external rating subject
    to competent authority approval, otherwise unrated exposure risk weights apply.
    In the same context, CRR3 distinguishes related exposure concepts such as SME,
    commitment, and unconditionally cancellable commitment (Art. 4(9)–(11)).
  DPM_context: Counterparty is reported in Large Exposures template C_27.00 "Identification
    of the counterparty" at {C_27.00, r*, c021} and {C_27.00, r*, c035}. It also appears
    in Counterparty Credit Risk template C_34.06 "Top twenty counterparties (CCR 6)"
    at {C_34.06, r*, c0010} and {C_34.06, r*, c0035}.
