- id: loan_to_deposit_ratio
  domain: Financial
  category: Banking
  title: Loan-to-Deposit Ratio
  business_description: 'The ratio of a bank''s total outstanding loans to its total
    deposits, expressed as a percentage. Measures the bank''s liquidity and its reliance
    on borrowed versus customer funds to finance lending activity.

    '
  detailed_description: 'Loan-to-Deposit Ratio (LDR) = (Total Loans / Total Deposits)
    × 100. A high LDR (above 100%) means the bank lends out more than it holds in
    deposits, increasing liquidity risk. Regulators use LDR as an early-warning indicator.
    The optimal range varies by jurisdiction but is commonly cited between 80–90%.
    This metric is computed from the loans and counterparties datasets.

    '
  synonyms:
  - LDR
  - Loans-to-Deposits
  related_objects:
  - source|banking|src.loans
  steward: ''
  tags:
  - liquidity
  - regulatory
  status: approved
