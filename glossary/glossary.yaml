- id: debt_equity_ratio
  domain: Financial
  category: Banking
  title: Debt Equity Ratio
  business_description: 'A financial leverage ratio comparing a company''s total liabilities
    to its shareholders'' equity. Indicates how much debt a company is using to finance
    its assets relative to the value represented in shareholders'' equity.

    '
  detailed_description: 'Debt-to-Equity Ratio (D/E) = Total Liabilities / Shareholders''
    Equity. A higher ratio generally means the company has been aggressive in financing
    its growth with debt. In banking credit analysis, a D/E above 2 is typically considered
    elevated for non-financial corporates. The ratio is derived from counterparty
    balance sheet data and is used in credit scoring models.

    '
  synonyms:
  - D/E Ratio
  - Leverage Ratio
  - Gearing Ratio
