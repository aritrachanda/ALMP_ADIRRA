  - risk
  - ifrs9
  - irb
  status: draft
  CRR_context: Per CRR3 Art. 4(54), “probability of default” or “PD” means the probability
    of default of an obligor or, where applicable, of a credit facility over a one-year
    period, and, in the context of dilution risk, the probability of dilution over
    a one-year period. It is also used as an input in IRB risk parameter estimation
