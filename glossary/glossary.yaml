    CRR3 concepts are SME status under Art. 4(9), which is based on annual turnover,
    and off-balance-sheet/credit risk concepts such as commitment, unconditionally
    cancellable commitment, funded credit protection, LGD and CCF in Art. 4(10), Art.
    4(11), Art. 4(56) and Art. 4(59).
