- id: enterprise_size
  domain: Financial
  category: Banking
  title: Enterprise Size
  business_description: 'A four-tier classification of a counterparty''s size — Micro,
    Small, Medium, or Large — based on the EU Commission Recommendation thresholds
    for headcount, annual turnover, and balance sheet total. Used to determine applicable
    credit risk treatment and reporting categories.

    '
  detailed_description: 'EU thresholds (any two of three criteria must be met or exceeded
    to move to the next tier): Micro (< 10 employees, < €2M turnover, < €2M BST),
    Small (< 50 employees, < €10M turnover, < €10M BST), Medium (< 250 employees,
    < €50M turnover, < €43M BST), Large (above Medium). In this dataset, the enterprise_size
    field is pre-classified and linked to annual_turnover, balance_sheet_total, and
    num_employees.

    '
  synonyms:
  - SME Classification
  - Firm Size
  related_objects:
  - source|banking|src.counterparties.enterprise_size
