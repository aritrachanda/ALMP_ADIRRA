terms:
- id: annual_turnover
  domain: Financial
  category: Banking
  title: Annual Turnover
  business_description: 'The total revenue generated by a counterparty entity over
    a 12-month fiscal period, expressed in the base currency of the reporting institution.
    Used as a primary indicator of entity size and financial capacity in credit risk
    assessments.

    '
  detailed_description: 'Annual Turnover is the gross income a business receives from
    its normal business activities, usually from the sale of goods and services to
    customers. In the context of credit risk, it is a key input to enterprise-size
    classification (Micro / Small / Medium / Large) under the EBA CRR definitions.
    A null value indicates that the figure was not reported or could not be verified
    for the reference date.

    '
  synonyms:
  - Revenue
  - Gross Revenue
  - Top-line Revenue
  related_objects:
  - source|banking|src.counterparties.annual_turnover
  - source|banking|src.counterparties.enterprise_size
  steward: ''
  tags:
  - credit-risk
  - counterparty
  status: approved
  CRR_context: Per CRR3 Art. 4(9), annual turnover is the criterion used to define
    an SME and means the annual turnover of a company, enterprise or undertaking according
    to its most recent consolidated accounts, with the threshold set at not exceeding
    EUR 50 000 000. In the provided CRR3 context, it is used as a size indicator for
    counterparties rather than as a separately defined credit-risk metric.
  DPM_context: ''
