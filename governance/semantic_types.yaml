# Governed semantic-type vocabulary for ADIRRA.
# Resolution only assigns a type_id from this list, or the reserved value "unresolved".
#
# Tier 2 type list (20 types total).
# Governing rule: a type_id earns a slot only if it has a validator OR distinct
# downstream handling. Modifiers (account vs counterparty, balance vs amount) are
# captured by the 'entity' facet, not by separate type_ids.
#
# confirmation_kind: validator | distribution | shape | none
#   (regex is NOT a confirmation_kind value — a `value_regex` detector is evaluated
#    for any type that declares one, independent of this field.)
# scope_source: global_standard | national_standard | distribution | default
# pii block: is_pii + category (personal_identity|financial_account|contact|personal_name|location|business_id)

# ── Validator-backed identifiers ─────────────────────────────────────────────
# Natural ID types carry their domain in the id (natural_<format>). Each has a
# real-world authority/format, so a validated value is near-certain.
- id: natural_iban
  label: IBAN
  category: natural_id
  primitive: [string]
  confirmation_kind: validator
  scope_source: global_standard
  pii: {is_pii: true, category: financial_account}
  detectors:
    name_tokens: [iban]
    value_regex: "^[A-Z]{2}[0-9]{2}[A-Z0-9]{1,30}$"
    validator: mod97
  expectations: [non_null, unique_ish, mod97_valid]
  regulatory: {bird: null, note: "CRR/COREP — account identifiers must be valid IBANs"}

- id: natural_bic
  label: BIC / SWIFT
  category: natural_id
  primitive: [string]
  confirmation_kind: validator
  scope_source: global_standard
  pii: {is_pii: false, category: null}
  detectors:
    name_tokens: [bic, swift]
    value_regex: "^[A-Z]{4}[A-Z]{2}[A-Z0-9][2-9A-Z]([A-Z0-9]{3})?$"
    validator: bic_structure
  expectations: [non_null, valid_bic]
  regulatory: {bird: null, note: "Required to identify financial institutions in cross-border reporting"}

- id: natural_lei
  label: LEI
  category: natural_id
  primitive: [string]
  confirmation_kind: validator
  scope_source: global_standard
  pii: {is_pii: false, category: null}
  detectors:
    name_tokens: [lei, legal_entity_identifier]
    value_regex: "^[A-Z0-9]{18}[0-9]{2}$"
    validator: lei_checksum
  expectations: [non_null, lei_checksum_valid]
  regulatory: {bird: null, note: "ISO 17442 — counterparty identification for regulatory submissions"}

- id: natural_isin
  label: ISIN
  category: natural_id
  primitive: [string]
  confirmation_kind: validator
  scope_source: global_standard
  pii: {is_pii: false, category: null}
  detectors:
    name_tokens: [isin, isin_code, security_id, instrument_id]
    value_regex: "^[A-Z]{2}[A-Z0-9]{9}[0-9]$"
    validator: isin_checksum
  expectations: [non_null, isin_checksum_valid]
  regulatory: {bird: null, note: "ISO 6166 — international securities identification number"}

- id: natural_henkilotunnus
  label: Finnish Personal ID (Henkilötunnus)
  category: natural_id
  primitive: [string]
  confirmation_kind: validator
  scope_source: national_standard
  pii: {is_pii: true, category: personal_identity}
  detectors:
    name_tokens: [hetu, henkilotunnus, personal_id, person_id, ssn_fi, pid_fi]
    value_regex: "^[0-9]{6}[-+ABCDEFUVWXY][0-9]{3}[0-9A-Z]$"
    validator: hetu_checksum
  expectations: [non_null, unique_ish, hetu_checksum_valid]
  regulatory: {bird: null, note: "Finnish national personal identity code — PII, GDPR Art. 9"}

- id: natural_yritystunnus
  label: Finnish Business ID (Y-tunnus)
  category: natural_id
  primitive: [string]
  confirmation_kind: validator
  scope_source: national_standard
  pii: {is_pii: false, category: null}
  detectors:
    name_tokens: [ytunnus, y_tunnus, business_id, yritystunnus, company_id_fi]
    value_regex: "^[0-9]{7}-[0-9]$"
    validator: y_tunnus_checksum
  expectations: [non_null, y_tunnus_checksum_valid]
  regulatory: {bird: null, note: "Finnish Business Information System identifier"}

# ── Generic NATURAL identifier — an identifier that carries real-world meaning
#    (it's the key of an external/real-world entity) but has no known global or
#    national format validator, e.g. an internal branch code or customer number.
#    Rarely rule-assigned from values alone (a natural-vs-surrogate call is hard
#    from data); usually reached via glossary/definition, value-overlap with
#    another table's key, or steward/LLM judgement. ──
- id: natural_key
  label: Natural Key
  category: natural_id
  primitive: [string, integer, decimal]
  confirmation_kind: distribution
  scope_source: default
  pii: {is_pii: false, category: null}
  detectors:
    name_tokens: [natural_key, business_key, business_key_id]
    value_regex: null
    validator: null
  expectations: [non_null, unique_ish]
  regulatory: {bird: null, note: null}

# ── Generic SURROGATE system id — a system-minted identifier with no external
#    meaning (serial, sequence, opaque _id/_key). This is the DEFAULT landing zone
#    for any identifier-shaped column that is not a known Natural format and not a
#    recognised UUID/hash: generic _id/_key columns and high-uniqueness primary-key
#    members. (Absorbs the pre-split generic 'identifier' type; legacy
#    'identifier'/'surrogate_identifier' records alias here.) ──
- id: surrogate_systemid
  label: Surrogate System ID
  category: surrogate_id
  primitive: [string, integer, decimal]
  confirmation_kind: distribution
  scope_source: default
  pii: {is_pii: false, category: null}
  detectors:
    name_tokens: [_id, _key, _ref, _no, _num, _number, id, pk, seq,
                  account_id, acct_id, counterparty_id, cpty_id, customer_id,
                  client_id, contract_id, loan_id, facility_id, deal_id,
                  trade_id, branch, branch_code, account_no, acct_no,
                  account_number, acc_id]
    value_regex: null
    validator: null
  expectations: [non_null, unique_ish]
  regulatory: {bird: null, note: null}

# ── Surrogate UUID / GUID — a system-minted identifier in the canonical dashed
#    8-4-4-4-12 form (any version, with optional {braces} / urn:uuid: prefix). The
#    structure is distinctive enough to VALIDATE, so a match is high-confidence. ──
- id: surrogate_uuid
  label: Surrogate UUID / GUID
  category: surrogate_id
  primitive: [string]
  confirmation_kind: validator
  scope_source: default
  pii: {is_pii: false, category: null}
  detectors:
    name_tokens: [uuid, guid, uid]
    value_regex: "^(urn:uuid:)?\\{?[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\\}?$"
    validator: uuid_format
  expectations: [non_null, unique_ish, valid_uuid]
  regulatory: {bird: null, note: null}

# ── Surrogate hash / opaque token — fixed-length hex (MD5=32, SHA-1=40,
#    SHA-256=64, SHA-512=128) with high uniqueness. This is SHAPE-ONLY: a hash
#    cannot be verified (any fixed-length hex id looks identical), so it is only
#    ever a low-confidence suggestion, never a validated match. ──
- id: surrogate_hash
  label: Surrogate Hash / Opaque Token
  category: surrogate_id
  primitive: [string]
  confirmation_kind: none
  scope_source: default
  pii: {is_pii: false, category: null}
  detectors:
    name_tokens: [hash, hashkey, hash_key, checksum, digest, fingerprint,
                  sha, sha1, sha256, sha512, md5]
    value_regex: null
    validator: null
  expectations: [non_null, unique_ish]
  regulatory: {bird: null, note: "Shape-only guess — a hash cannot be verified, only recognised by its fixed-length hex shape."}

