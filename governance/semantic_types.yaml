# ── Monetary ──────────────────────────────────────────────────────────────────
- id: monetary_amount
  label: Monetary Amount
  category: monetary
  primitive: [integer, decimal]
  confirmation_kind: shape
  scope_source: default
  pii: {is_pii: false, category: null}
  detectors:
    name_tokens: [amount, amt, nominal, notional, exposure, outstanding,
                  balance, bal, outstanding_balance, current_balance, book_value,
                  carrying_amount, principal, face_value, market_value,
                  fair_value, fair_val, net_value, gross_value, present_value,
                  intrinsic_value, dirty_price, clean_price, accrued,
                  price, strike, strike_price, premium,
                  consideration, proceeds, settlement_amount, par_value,
                  limit, credit_limit, total_limit, available_limit]
    value_regex: null
    validator: null
    shape:
      primitive: [integer, decimal]
      any_of:                                  # >=1 strong signal required to initiate
        - decimal_scale_consistent: {min_share: 0.90, scales: [2, 3, 4]}
        - declared_scale: {min: 2}             # forward-compat; inert until a profiler field feeds it
        - currency_sibling: {scope: table}     # context conjunct: a currency-typed sibling column
      none_of:                                 # negative gates - suppress initiation
        - unique_ratio: {gte: 0.95}            # identifier signature
        - year_like_range: true                # temporal signature
        - low_cardinality_enum: {max_distinct: 10, max_ratio: 0.02}  # status-flag signature
        - bounded_range: {ranges: [[-1, 1]]}   # rate signature
  expectations: [non_null, numeric]
  regulatory: {bird: null, note: null}

- id: rate
  label: Rate / Ratio
  category: rate
  primitive: [integer, decimal]
  confirmation_kind: shape
  scope_source: default
  pii: {is_pii: false, category: null}
  detectors:
    name_tokens: [rate, coupon, yield, spread, margin, libor, euribor,
                  interest_rate, pct, percent, percentage, ratio, fraction,
                  ltv, pd, lgd, ead, rwa, haircut, weight, factor]
    value_regex: null
    validator: null
    shape:
      primitive: [decimal, integer]
      any_of:
        - bounded_range: {ranges: [[-1, 1], [0, 100]], min_share: 0.95}
        - decimal_scale_consistent: {min_share: 0.90, scales: [4, 5, 6]}   # bp-style precision
      none_of:
        - unique_ratio: {gte: 0.90}
        - year_like_range: true
  expectations: [numeric]
  regulatory: {bird: null, note: null}

# ── Generic quantity (generic numeric measure landing zone, sibling of
#    identifier/reference_code). Shape-passing numerics that can't be
#    discriminated monetary-vs-rate land here. Generic-precedence demotion
#    applies. ──
- id: quantity
  label: Quantity / Measure
  category: quantity
  primitive: [integer, decimal]
  confirmation_kind: shape
  scope_source: default
  pii: {is_pii: false, category: null}
  detectors:
    # No name_tokens: quantity is shape-driven under evidence widening only, so it
    # stays fully inert at flag-off (changes no existing column's resolution). It is
    # the generic landing zone for numerics that pass shape but can't be discriminated
    # as monetary vs rate.
    name_tokens: []
    value_regex: null
    validator: null
    shape:
      primitive: [integer, decimal]
      any_of:
        - decimal_scale_consistent: {min_share: 0.80, scales: [0, 1, 2, 3, 4, 5, 6]}
      none_of:
        - unique_ratio: {gte: 0.95}
        - year_like_range: true
        - low_cardinality_enum: {max_distinct: 10, max_ratio: 0.02}
  expectations: [numeric]
  regulatory: {bird: null, note: null}

