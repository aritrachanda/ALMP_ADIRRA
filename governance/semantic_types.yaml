  pii: {is_pii: false, category: null}
  detectors:
    name_tokens: [date, dt, day, reporting_date, report_date, reference_date,
                  as_of_date, value_date, obs_date, maturity_date, maturity,
                  expiry_date, expiry, end_date, termination_date,
                  opening_date, closing_date, start_date, effective_date,
                  datadate]
    value_regex: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
    validator: date_range
  expectations: [non_null, valid_date]
  regulatory: {bird: null, note: null}

